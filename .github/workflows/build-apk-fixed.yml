name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Find ZIP
        run: |
          set -e
          echo "Searching for ZIP..."
          find . -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf /tmp/flutter_source
          mkdir -p /tmp/flutter_source

          unzip -q "$ZIP_FILE" -d /tmp/flutter_source

          echo "ZIP extracted"
          find /tmp/flutter_source -type f -name "pubspec.yaml" -print

      - name: Find Flutter project
        run: |
          set -e

          SOURCE_DIR=""

          while IFS= read -r PUBSPEC; do
            DIR=$(dirname "$PUBSPEC")

            if [ -d "$DIR/lib" ]; then
              SOURCE_DIR="$DIR"
              break
            fi
          done < <(find /tmp/flutter_source -type f -name "pubspec.yaml")

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Flutter project not found"
            find /tmp/flutter_source -maxdepth 6 -type f -print
            exit 1
          fi

          echo "Flutter project found:"
          echo "$SOURCE_DIR"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Create clean Flutter project
        run: |
          set -e

          rm -rf fresh_app

          flutter create \
            --platforms=android \
            --org com.terebaronline \
            --project-name terebar_online \
            fresh_app

          rm -rf fresh_app/lib
          cp -r "$SOURCE_DIR/lib" fresh_app/lib

          if [ -d "$SOURCE_DIR/assets" ]; then
            cp -r "$SOURCE_DIR/assets" fresh_app/assets
          fi

          cp "$SOURCE_DIR/pubspec.yaml" fresh_app/pubspec.yaml

      - name: Get dependencies
        working-directory: fresh_app
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
