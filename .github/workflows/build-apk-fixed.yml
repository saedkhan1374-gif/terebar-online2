name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Extract Flutter source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name 'terebar_online_complete_flutter.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf /tmp/flutter_source
          mkdir -p /tmp/flutter_source

          unzip -q "$ZIP_FILE" -d /tmp/flutter_source

          echo "Searching for Flutter project..."

          find /tmp/flutter_source -type f -name "pubspec.yaml" -print

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=""

          while IFS= read -r pubspec; do
            DIR=$(dirname "$pubspec")

            if [ -d "$DIR/lib" ]; then
              SOURCE_DIR="$DIR"
              break
            fi
          done < <(find /tmp/flutter_source -type f -name "pubspec.yaml")

          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: Flutter project not found."
            echo "Contents of extracted ZIP:"
            find /tmp/flutter_source -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Flutter source found at:"
          echo "$SOURCE_DIR"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -e

          rm -rf fresh_app

          flutter create \
            --platforms=android \
            --org com.terebaronline \
            --project-name terebar_online \
            fresh_app

          echo "Copying application source..."

          rm -rf fresh_app/lib
          cp -r "$SOURCE_DIR/lib" fresh_app/lib

          if [ -d "$SOURCE_DIR/assets" ]; then
            rm -rf fresh_app/assets
            cp -r "$SOURCE_DIR/assets" fresh_app/assets
          fi

          cp "$SOURCE_DIR/pubspec.yaml" fresh_app/pubspec.yaml

          echo "Source copied successfully."

      - name: Get dependencies
        working-directory: fresh_app
        run: |
          flutter pub get

      - name: Build APK
        working-directory: fresh_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
