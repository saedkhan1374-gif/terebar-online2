name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Extract ZIP
        run: |
          unzip -q terebar_online_complete_flutter.zip

      - name: Create clean Flutter project
        run: |
          flutter create --platforms=android \
            --org com.terebaronline \
            --project-name terebar_online \
            fresh_app

      - name: Copy app code
        run: |
          rm -rf fresh_app/lib
          cp -r terebar_online_full/lib fresh_app/lib

          if [ -d terebar_online_full/assets ]; then
            cp -r terebar_online_full/assets fresh_app/assets
          fi

      - name: Add assets to pubspec
        working-directory: fresh_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()

          s = s.replace(
              "  cupertino_icons: ^1.0.8",
              ""
          )

          if "assets:" not in s:
              s += """
          flutter:
            uses-material-design: true
            assets:
              - assets/
          """

          p.write_text(s)
          PY

      - name: Get packages
        working-directory: fresh_app
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terebar-online-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
