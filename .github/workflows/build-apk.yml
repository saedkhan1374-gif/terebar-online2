name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Extract original project
        run: |
          unzip -q terebar_online_complete_flutter.zip
          mkdir -p original
          cp -r terebar_online_full/lib original/
          cp -r terebar_online_full/assets original/

      - name: Create clean Flutter project
        run: |
          flutter create --platforms=android \
            --org com.terebaronline \
            --project-name terebar_online fresh_app

      - name: Copy application code
        run: |
          rm -rf fresh_app/lib
          cp -r original/lib fresh_app/lib

          rm -rf fresh_app/assets
          cp -r original/assets fresh_app/assets

      - name: Update pubspec
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fresh_app/pubspec.yaml")
          s = p.read_text()

          s = s.replace(
              "cupertino_icons: ^1.6.0",
              "cupertino_icons: ^1.0.8"
          )

          marker = "  cupertino_icons: ^1.0.8"
          if marker not in s:
              s = s.replace(
                  "  flutter:\n    sdk: flutter",
                  "  flutter:\n    sdk: flutter\n\n  cupertino_icons: ^1.0.8"
              )

          if "  assets:" not in s:
              s += "\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/\n"

          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: fresh_app
        run: flutter pub get

      - name: Build release APK
        working-directory: fresh_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terebar-online-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
