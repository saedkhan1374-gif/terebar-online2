name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q terebar_online_complete_flutter.zip
          PROJECT_DIR=$(find . -name pubspec.yaml -not -path './.github/*' -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          flutter create --platforms=android fresh_app

      - name: Copy app files
        run: |
          cp -r "$PROJECT_DIR/lib" fresh_app/
          cp "$PROJECT_DIR/pubspec.yaml" fresh_app/
          if [ -d "$PROJECT_DIR/assets" ]; then
            cp -r "$PROJECT_DIR/assets" fresh_app/
          fi

      - name: Get dependencies
        working-directory: fresh_app
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terebar-online-apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
