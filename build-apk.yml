name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create standard Flutter Android project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/flutter_app
          flutter create --platforms=android --org com.terebaronline --project-name terebar_online /tmp/flutter_app

          rm -rf /tmp/flutter_app/lib
          cp -r lib /tmp/flutter_app/lib

          if [ -d assets ]; then
            rm -rf /tmp/flutter_app/assets
            cp -r assets /tmp/flutter_app/assets
          fi

          cp pubspec.yaml /tmp/flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /tmp/flutter_app/build/app/outputs/flutter-apk/app-release.apk
